# ELP-Orpheus Docker Compose
# 双卡 GPU 访问 + 项目卷挂载 + 测试运行
#
# 用法：
#   docker compose run --rm elp-orpheus                              # 运行全部测试
#   docker compose run --rm elp-orpheus python -m pytest tests/test_crossfade.py -v  # 单项测试
#   docker compose run --rm elp-orpheus python scheduler/build_token_router.py       # 编译 C++ 模块
#   docker compose run --rm elp-orpheus bash                         # 交互式 shell

services:
  elp-orpheus:
    build: .
    image: elp-orpheus:latest
    container_name: elp-orpheus
    # 双卡 GPU 访问（RTX 3080 × 2）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # 挂载项目目录到容器内 /workspace
    volumes:
      - ./:/workspace
    # 共享内存（PyTorch DataLoader / multiprocessing 需要）
    shm_size: 4gb
    # 环境变量：双卡均可见（容器内用 CUDA_VISIBLE_DEVICES 隔离）
    environment:
      - CUDA_VISIBLE_DEVICES=0,1
      - PYTHONPATH=/workspace
