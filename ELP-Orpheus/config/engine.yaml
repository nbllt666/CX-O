# ELP-Orpheus FT 引擎配置
# 本文件为整个 ELP-Orpheus 引擎的统一配置入口，后续 ft_engine / scheduler / ipc
# 等模块均从此文件读取参数。所有字段使用中文注释说明用途，便于维护。

# ============================================================================
# gpu: GPU 物理隔离分配（双 RTX 3080 20GB）
# ============================================================================
# 双卡物理隔离是本项目的核心部署策略：
#   - GPU 0 专属 Gemma 4 E4B（FT 引擎），保证 LLM 首 token 延迟（TTFT）稳定 <80ms
#   - GPU 1 专属 Orpheus TTS（FT 骨干 + Audio Head + SNAC 解码器）
# 两张卡各自独立显存带宽，互不争抢，避免 Orpheus 解码导致的显存带宽波动拖慢 Gemma。
gpu:
  # GPU 0 专属 Gemma 4 E4B FT 引擎
  gpu0:
    role: gemma          # 角色标识：gemma 表示此卡运行 Gemma 4 E4B 语言模型
    device_id: 0         # 物理 GPU 索引（nvidia-smi 顺序）
    cuda_visible_devices: "0"   # 通过 CUDA_VISIBLE_DEVICES 环境变量将该进程绑定到 GPU 0
  # GPU 1 专属 Orpheus TTS（FT 骨干 + Audio Head + SNAC）
  gpu1:
    role: orpheus        # 角色标识：orpheus 表示此卡运行 Orpheus TTS 全链路
    device_id: 1         # 物理 GPU 索引
    cuda_visible_devices: "1"   # 通过 CUDA_VISIBLE_DEVICES 环境变量将该进程绑定到 GPU 1

# ============================================================================
# ft: FasterTransformer 引擎参数（Ampere FP16 Tensor Core 最优）
# ============================================================================
# 该段配置 Llama-3B 骨干在 FT 中的运行参数。RTX 3080 为 Ampere 架构，
# FP16 Tensor Core 吞吐最高，因此默认 data_type=fp16。
ft:
  checkpoint_path: "checkpoints/orpheus-llama3b-ft"   # FT 格式 checkpoint 路径（经 scripts/ 转换后的产物）
  tensor_para_size: 1                                   # 单卡张量并行（双卡物理隔离下无需 TP）
  pipeline_para_size: 1                                 # 单卡流水线并行
  data_type: "fp16"                                     # FP16（3080 FP16 Tensor Core 效率最高）
  cuda_graph: true                                      # 必做：开启 CUDA Graphs，Decode 单 token <1ms
  max_seq_len: 512                                      # 连续 KV Cache 最大序列长度（流式分块下 512 足够）
  max_batch_size: 1                                     # 流式 TTS 单批（流式逐 chunk 推理，批=1）
  hidden_dim: 3072                                      # Llama-3B 隐藏维度
  num_layers: 28                                        # Llama-3B 层数（按实际模型调整）
  # 预分配连续 KV Cache 张量形状: [num_layers, 2, max_seq_len, batch, hidden_dim]
  # 其中 2 表示 K/V 两份；连续显存分配避免碎片化，配合增量 KV Cache 实现低延迟解码。

# ============================================================================
# ipc: 极简 IPC 通信层（抛弃 gRPC/HTTP，单条消息 <1ms）
# ============================================================================
# 抛弃 gRPC/HTTP 等重量级 RPC 框架，改用 ZeroMQ 传递原始 Token ID 数组。
# Token ID 为整型数组，用 raw_array 序列化（直接 memcpy），避免 JSON 文本编解码开销。
ipc:
  backend: "zeromq"          # ZeroMQ（跨平台，Windows/Linux 均可）
  # 部署服务器(Linux)用 UDS（Unix Domain Socket）零拷贝；Windows 开发用 tcp://127.0.0.1:5555
  endpoint: "ipc:///tmp/orpheus-tokens.sock"   # 部署服务器(Linux)用 UDS；Windows 开发用 tcp://127.0.0.1:5555
  serialize: "raw_array"     # 原始 Token ID 数组序列化（非 JSON 文本），直接按 int32 内存布局传输

# ============================================================================
# chunk: 语义感知分块 Router 参数
# ============================================================================
# 中央调度器按语义边界切分长文本，避免在词中间切断导致 TTS 拼读异常。
chunk:
  max_chunk_tokens: 20              # 最大 Chunk 长度（tokens），超长强制切分
  split_punctuation: "，。！？"     # 标点触发切分（中文逗号/句号/感叹/问号）

# ============================================================================
# audio: 音频输出参数
# ============================================================================
# Orpheus SNAC 解码器输出 24kHz 音频，相邻 chunk 之间用 Crossfade 重叠过渡，
# 消除拼接处可感知的"咔哒"爆音。
audio:
  sample_rate: 24000        # Orpheus SNAC 输出采样率
  crossfade_ms: 50          # 相邻 Chunk 边界 Crossfade 重叠时长（ms）
