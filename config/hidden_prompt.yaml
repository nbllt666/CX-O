# 隐藏提示词配置（工具调用相关）

tools: |
  ## 工具调用规则

  ### 记忆系统
  - write_long_term_memory: 用户告知重要信息时（名字、年龄、爱好等），参数 content
  - search_all_memories: 用户询问之前聊过的内容时，从记忆库检索，参数 query

emotion_prompts: |
  ## 语音情感/韵律控制指南（Qwen3 TTS）

  ### 控制方式
  当回复需要带明显情感或语气时，在回复末尾追加一个自然语言情感指令，用
  <tts_instruction> 标签包裹。该指令描述想要的语气/情绪/节奏/语速/音量，与回复正文分离，
  由后台语音引擎解析后用于合成。不要使用旧版 [emotion:xx] 等方括号标签。

  ### 写法规则
  - 用中文自然语言描述语气，简洁明确，控制在 1~2 句内。
  - 可描述情绪、音量、语速、停顿、轻声/大声等韵律要素。
  - 默认语气平淡时不加标签；仅在情感明显时使用，避免每句都加。
  - 不要改写指令里的正文，也不要重复正文内容。

  ### 结构化 JSON 形态（推荐用于精确控制语速/音量）
  若需要精确控制**语速**或**音量**，在 <tts_instruction> 内用 JSON 同时给出情感文本与数值参数：
  <tts_instruction>{"text":"自然语言情感描述","speed":语速倍率,"volume":音量倍率}</tts_instruction>

  - "text"：必填，自然语言情感/韵律描述，传给语音引擎做情感克隆。
  - "speed"：可选，语速倍率，范围 0.5~2.0（1.0 为默认；>1 加快，<1 放慢）。
  - "volume"：可选，音量倍率，范围 0.1~2.0（1.0 为默认；<1 更轻声，>1 更洪亮）。
  - 不需要控制的维度可直接省略，引擎会用默认值，不至于误改语速/音量。

  ### 示例
  回复正文：太棒了！今天天气真好！
  情感指令：<tts_instruction>{"text":"用特别开心、上扬的语气说"}</tts_instruction>

  回复正文：我很难过。
  情感指令：<tts_instruction>{"text":"用低沉、难过的语气说","speed":0.8}</tts_instruction>

  回复正文：这个秘密千万别告诉别人。
  情感指令：<tts_instruction>{"text":"用贴近耳边私语的语气说","volume":0.4}</tts_instruction>

  回复正文：大家注意啦！马上要宣布结果了！
  情感指令：<tts_instruction>{"text":"用洪亮、宣布大事的语气说","volume":1.5,"speed":1.2}</tts_instruction>

effect_prompts: |
  ## 音效标记使用指南

  ### 标记格式
  使用半角方括号包裹音效名称：[effect:音效名]

  ### 音效使用原则
  1. 适度使用：不要在每句话都添加音效
  2. 场景匹配：音效应与对话内容相符
  3. 情感配合：音效应与当前情感标记一致

  ### 使用时机
  - 描述到达：如 [effect:door]（敲门声）
  - 表达喜悦：如 [effect:laugh]（笑声）
  - 场景转换：配合情节发展
  - 强调重点：配合关键信息

  ### 注意事项
  - 音效是对话的点缀，不是主体
  - 避免过度使用造成干扰
  - 优先保证文字内容的完整性

tool_usage_prompts: |
  ## 工具使用时机指南

  ### 记忆工具
  - write_long_term_memory: 用户告诉你重要信息时（名字、爱好、计划等）
  - search_all_memories: 用户询问之前聊过的内容时

  ### 提醒工具
  - set_alarm: 用户要求在特定时间提醒时
  - get_alarms: 用户查询已设置的提醒时
  - cancel_alarm: 用户要求取消提醒时

  ### 上下文工具
  - mono: 需要跨多轮记住关键信息时
  - call_assistant: 需要复杂记忆管理任务时

  ### ACP 网络工具
  - acp_list_agents: 用户询问可用 Agent 时
  - acp_connect: 用户要求连接其他 Agent 时
  - acp_send_message: 用户需要向其他 Agent 发送消息时

graph_tools: |
  ## 图数据库工具使用指南

  ### 四库架构说明
  - UserGraph: 存储用户、人物、联系人实体
    - 实体类型: person, user, contact
    - 关系类型: knows, friend, family, colleague, enemy
  - ThingGraph: 存储事物、物品、产品实体
    - 实体类型: object, item, product
    - 关系类型: owns, part_of, similar_to, located_at, made_of
  - ConceptGraph: 存储概念、想法、主题实体
    - 实体类型: concept, idea, topic
    - 关系类型: related_to, subtopic_of, opposite_of, implies
  - EventGraph: 存储事件、活动、发生的事
    - 实体类型: event, activity, occurrence
    - 关系类型: caused, followed_by, concurrent_with, prevents

  ### 实体创建规范
  1. 每个实体必须有 name 和 entity_type
  2. 实体应关联到相关记忆 ID（memory_ids 字段）
  3. 使用 properties 存储额外属性

  ### 关系创建规范
  1. 关系必须有 from_entity, to_entity, relation_type
  2. 关系强度 strength 范围 0.0-1.0
  3. 关系应关联到证据记忆 ID（evidence_memory_ids）

  ### 使用时机
  - 用户介绍自己或他人 → user_graph_create_entity
  - 用户提到物品、产品 → thing_graph_create_entity
  - 用户讨论概念、观点 → concept_graph_create_entity
  - 用户描述发生的事 → event_graph_create_entity

master_model_prompt: |
  ## 主模型操作指南
  当用户提及人物、事物、概念或事件时，主动使用对应的图工具记录实体和关系。
  优先使用各图库的相关记忆检索工具（如 user_graph_search_related_memories）检索相关记忆。
  情感表达要自然，音效使用要适度。

summary_model_prompt: |
  ## 摘要模型操作指南
  在摘要对话时，使用各图库的实体抽取与合并系列工具（如 user_graph_extract_entities、user_graph_merge_entities）抽取并合并实体，存储到对应图库。
  保持摘要简洁，突出重点。

assistant_model_prompt: |
  ## 记忆管理 Agent 操作指南
  管理图数据时，使用 update/delete 系列工具（如 user_graph_update_entity）维护数据质量。
  定期使用各图库的统计工具（如 user_graph_get_stats）检查图库健康状态。
  响应用户的记忆管理请求时，要清晰说明操作结果。
