# v3 防火墙配置 - ASR 打断

interrupt:
  enabled: true
  mode: "main_llm"  # 模式: main_llm | independent_llm
  
  # 模式 A: 主 LLM（低延迟）
  main_llm:
    enabled: true
    prompt: |
      你是一个直播助手。当用户说话时，你需要判断是否需要打断当前正在进行的回复。
      输出 "##[interrupt]##" 表示需要打断并回复用户。
      输出 "##[no_reply]##" 表示不需要回复。
      
  # 模式 B: 独立 LLM（专用决策）
  independent_llm:
    enabled: false
    model: "qwen2.5:1.5b"
    endpoint: "http://localhost:11434"
    polling_interval_ms: 1000
    timeout_ms: 5000
    
  rules:
    auto_reply_on_interrupt: true
    priority_users:
      - guard_level: 3  # 舰艇总督
      - is_admin: true  # 房管
