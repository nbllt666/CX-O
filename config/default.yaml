server:
  host: 0.0.0.0
  port: 8100
  debug: true
cors:
  enabled: true
  origins:
  - '*'
  methods:
  - '*'
  headers:
  - '*'
  allow_credentials: true
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  file: logs/app.log
  max_bytes: 10485760
  backup_count: 5
database:
  type: sqlite
  path: data/cxhms.db
  memories_db: data/memories.db
  sessions_db: data/sessions.db
  acp_db: data/acp
  echo: false
models:
  main:
    provider: ollama
    host: http://localhost:11434
    model: qwen3-vl:8b
    apiKey: ''
    enabled: true
    port: 8000
    temperature: 0.7
    max_tokens: 0
    timeout: 60
    api_key: ''
  summary:
    provider: ollama
    host: http://localhost:11434
    model: qwen3-vl:8b
    apiKey: ''
    enabled: false
    port: 8000
    temperature: 0.7
    max_tokens: 131072
    timeout: 60
    api_key: ''
  memory:
    provider: ollama
    host: http://localhost:11434
    model: qwen3-vl:8b
    apiKey: ''
    enabled: false
    port: 8000
    temperature: 0.7
    max_tokens: 131072
    timeout: 60
    api_key: ''
model_defaults:
  summary: main
  memory: main
agent:
  agent_id: cxhms_agent_001
  name: CXHMS Agent
  version: 1.0.0
  description: 一个智能记忆管理系统
  capabilities:
  - memory
  - tools
  - chat
  - context
memory:
  enabled: true
  max_memories: 10000
  default_importance: 3
  decay_enabled: true
  decay_rate: 0.1
  decay_interval_days: 7
  reactivation_boost: 0.2
  emotion_enabled: true
  vector_enabled: true
  vector_backend: weaviate
  decay_model: exponential
  ebbinghaus_params:
    t50: 30.0
    k: 2.0
  chroma:
    db_path: data/chroma_db
    collection_name: memory_vectors
    vector_size: 768
  milvus_lite:
    db_path: data/milvus_lite.db
    vector_size: 768
  qdrant:
    host: localhost
    port: 6333
    vector_size: 768
  weaviate:
    host: localhost
    port: 8090
    grpc_port: 50061
    embedded: false
    vector_size: 768
    schema_class: CXHMSMemory
    api_key: null
  graph_enabled: true
  graph_backend: neo4j
  neo4j:
    uri: bolt://localhost:7687
    user: neo4j
    password: password
    database: neo4j
    max_connection_pool_size: 50
  graph_libraries:
    user:
      enabled: true
      label_prefix: User
    thing:
      enabled: true
      label_prefix: Thing
    concept:
      enabled: true
      label_prefix: Concept
    event:
      enabled: true
      label_prefix: Event
  hybrid_search_enabled: false
  archive_enabled: true
  dedup_threshold: 0.85
  archive_compression_enabled: true
context:
  enabled: true
  max_context_length: 4000
  context_window: 10
  include_memories: true
  max_memories_in_context: 5
tools:
  enabled: true
  auto_discovery: true
  mcp_enabled: false
  builtin_tools:
  - calculator
  - datetime
  - weather
acp:
  enabled: true
  local_agent_id: cxhms_agent_001
  local_agent_name: CXHMS Agent
  discovery_enabled: true
  discovery_port: 9999
  broadcast_port: 9998
  broadcast_address: 255.255.255.255
  discovery_interval: 30
security:
  api_key_enabled: false
  api_key: ''
  rate_limit_enabled: false
  rate_limit_requests: 100
  rate_limit_period: 60
monitoring:
  enabled: true
  metrics_enabled: true
  health_check_enabled: true
  performance_logging: true
llm_params:
  temperature: 0.7
  maxTokens: 0
  topP: 0.9
  timeout: 30
tts:
  mode: remote          # embedded | remote
  model_dir: F5TTS_v1_Base
  device: cuda
  remote_url: http://127.0.0.1:5000
  engine: f5-tts
  f5_tts:
    url: http://127.0.0.1:5000
    timeout: 120
  cosyvoice:
    url: http://127.0.0.1:50000
    model: CosyVoice2-0.5B
    default_mode: instruct2
    timeout: 120
    default_spk_id: 中文女
  emotion_refs:
    enabled: true
    emotions_dir: data/voice_refs/emotions
    transitions_dir: data/voice_refs/transitions
    emotions:
    - normal
    - happy
    - sad
    - angry
    - surprised
    - tender
    - fearful
    - disgusted
  transition:
    enabled: true
    duration: 0.5
    intensity: 0.7
    transition_text: 嗯，
  ref_audio_path: ""
  ref_text: ""
  speed: 1.0
  cross_fade_duration: 0.15
  emotion_enabled: true
  effects_enabled: true
  emotion_voices: {}
avatar:
  type: "live2d"
  live2d:
    enabled: false
    model_path: "/models/shizuku/shizuku.model.json"
    width: 300
    min_width: 200
    max_width: 400
    position: "left"
    lip_sync: true
    idle_motion: true
    scale: 0.3
    x_offset: 0
    y_offset: 0
  vrm:
    enabled: false
    model_path: "/models/avatar.vrm"
    width: 300
    min_width: 200
    max_width: 400
    position: "left"
    lip_sync: true
    idle_animation: true
    look_at_mouse: true
    scale: 1.0
    position_3d: [0, 0, 0]
asr:
  mode: remote          # embedded | remote
  model_dir: SenseVoiceSmall
  device: cuda
  remote_url: http://127.0.0.1:8001
voice_workstation:
  url: http://127.0.0.1:8200
  enabled: true
