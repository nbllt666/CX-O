server:
  host: 0.0.0.0
  port: 8000
  debug: true
cors:
  enabled: true
  origins:
  - '*'
  methods:
  - '*'
  headers:
  - '*'
  allow_credentials: true
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  file: logs/app.log
  max_bytes: 10485760
  backup_count: 5
database:
  type: sqlite
  path: data/cxhms.db
  memories_db: data/memories.db
  sessions_db: data/sessions.db
  acp_db: data/acp
  echo: false
models:
  main:
    provider: ollama
    host: http://localhost:11434
    model: qwen3-vl:8b
    apiKey: ''
    enabled: true
    port: 8000
    temperature: 0.7
    max_tokens: 0
    timeout: 60
    api_key: ''
  summary:
    provider: ollama
    host: http://localhost:11434
    model: qwen3-vl:8b
    apiKey: ''
    enabled: false
    port: 8000
    temperature: 0.7
    max_tokens: 131072
    timeout: 60
    api_key: ''
  memory:
    provider: ollama
    host: http://localhost:11434
    model: qwen3-vl:8b
    apiKey: ''
    enabled: false
    port: 8000
    temperature: 0.7
    max_tokens: 131072
    timeout: 60
    api_key: ''
model_defaults:
  summary: main
  memory: main
agent:
  agent_id: cxhms_agent_001
  name: CXHMS Agent
  version: 1.0.0
  description: 一个智能记忆管理系统
  capabilities:
  - memory
  - tools
  - chat
  - context
memory:
  enabled: true
  max_memories: 10000
  default_importance: 3
  decay_enabled: true
  decay_rate: 0.1
  decay_interval_days: 7
  reactivation_boost: 0.2
  emotion_enabled: true
  vector_enabled: true
  vector_backend: weaviate
  decay_model: exponential
  ebbinghaus_params:
    t50: 30.0
    k: 2.0
  chroma:
    db_path: data/chroma_db
    collection_name: memory_vectors
    vector_size: 768
  milvus_lite:
    db_path: data/milvus_lite.db
    vector_size: 768
  qdrant:
    host: localhost
    port: 6333
    vector_size: 768
  weaviate:
    host: localhost
    port: 8090
    grpc_port: 50061
    embedded: false
    vector_size: 768
    schema_class: CXHMSMemory
    api_key: null
  graph_enabled: true
  graph_backend: neo4j
  neo4j:
    uri: bolt://localhost:7687
    user: neo4j
    password: password
    database: neo4j
    max_connection_pool_size: 50
  graph_libraries:
    user:
      enabled: true
      label_prefix: User
    thing:
      enabled: true
      label_prefix: Thing
    concept:
      enabled: true
      label_prefix: Concept
    event:
      enabled: true
      label_prefix: Event
  hybrid_search_enabled: false
  archive_enabled: true
  dedup_threshold: 0.85
  archive_compression_enabled: true
context:
  enabled: true
  max_context_length: 4000
  context_window: 10
  include_memories: true
  max_memories_in_context: 5
tools:
  enabled: true
  auto_discovery: true
  mcp_enabled: false
  builtin_tools:
  - calculator
  - datetime
  - weather
acp:
  enabled: true
  local_agent_id: cxhms_agent_001
  local_agent_name: CXHMS Agent
  discovery_enabled: true
  discovery_port: 9999
  broadcast_port: 9998
  broadcast_address: 255.255.255.255
  discovery_interval: 30
security:
  api_key_enabled: false
  api_key: ''
  rate_limit_enabled: false
  rate_limit_requests: 100
  rate_limit_period: 60
monitoring:
  enabled: true
  metrics_enabled: true
  health_check_enabled: true
  performance_logging: true
llm_params:
  temperature: 0.7
  maxTokens: 0
  topP: 0.9
  timeout: 30
tts:
  # Qwen3 TTS 唯一合成路径（F5-TTS / Orpheus / CosyVoice 旧引擎已随 Qwen3 迁移移除）
  mode: remote
  device: cuda
  remote_url: ""
  ref_audio_path: ""
  ref_text: ""
  speed: 1.0
  cross_fade_duration: 0.15
  emotion_enabled: true
  effects_enabled: true
  transitions_dir: data/voice_refs/transitions
  transition_enabled: true
  transition_text: 嗯，
  # 统一参考音频资产存储（prompt 生成 / 外部文件双来源）
  ref_audio_assets_dir: data/ref_audio_assets
  allowed_ref_audio_dirs: []
  max_ref_audio_size_mb: 50
avatar:
  type: "live2d"
  live2d:
    enabled: false
    model_path: "/models/shizuku/shizuku.model.json"
    width: 300
    min_width: 200
    max_width: 400
    position: "left"
    lip_sync: true
    idle_motion: true
    scale: 0.3
    x_offset: 0
    y_offset: 0
  vrm:
    enabled: false
    model_path: "/models/avatar.vrm"
    width: 300
    min_width: 200
    max_width: 400
    position: "left"
    lip_sync: true
    idle_animation: true
    look_at_mouse: true
    scale: 1.0
    position_3d: [0, 0, 0]
asr:
  mode: remote          # embedded | remote
  model_dir: SenseVoiceSmall
  device: cuda
  remote_url: http://127.0.0.1:8001
voice_workstation:
  url: http://127.0.0.1:8200
  enabled: true
live:
  enabled: true
  mode: "integrated"
  stage:
    avatar_type: "live2d"
    background_color: "#1a1a2e"
    background_image: ""
  danmaku:
    enabled: true
    position: "right"
    max_count: 50
    speed: 8
    font_size: 24
    font_family: "sans-serif"
    opacity: 0.9
    colors:
      default: "#ffffff"
      member: "#ff6b6b"
      admin: "#ffd93d"
  subtitle:
    enabled: true
    position: "bottom"
    max_lines: 3
    font_size: 28
    font_family: "sans-serif"
    color: "#ffffff"
    background: "rgba(0,0,0,0.6)"
    typing_speed: 50
    auto_clear: true
    clear_delay: 5000
  notifications:
    gift_enabled: true
    enter_enabled: true
  audio:
    input_device: ""
    output_volume: 1.0
    tts_volume: 1.0
    noise_suppression: true
    mic_enabled: false
    mic_volume: 1.0
    aec:
      enabled: true
      mode: "auto"
      suppression_db: 30
      manual_balance: 0.5
    sync:
      enabled: true
      tick_interval_ms: 100
      max_drift_ms: 100
      target_sync_ms: 200
  latency:
    target_ms: 500
    ws_heartbeat_interval: 15
    reconnect_base_ms: 100
    reconnect_max_ms: 2000
  split:
    avatar_resolution: "1920x1080"
    danmaku_resolution: "1920x1080"
    subtitle_resolution: "1920x1080"
limits:
  memory:
    max_memories: 30
    min_score_threshold: 0.15
    hybrid_search_limit: 30
    hybrid_search_min_score: 0.15
    vector_min_score: 0.3
    inject_memories_count: 20
    rag_search_limit: 20
    entity_extract_max_content: 8000
    max_entities: 50
    max_relationships: 100
    entity_candidates: 50
    search_memories_limit: 10
    search_similar_threshold: 0.5
    search_similar_limit: 10
    chat_history_limit: 50
    memory_logs_limit: 100
    search_all_limit: 10
  context:
    max_messages: 500
    window_size: 50
    summary_threshold: 100
    max_history: 500
    conversation_max_messages: 100
    conversation_recent_window: 20
    chat_context_limit: 10
  firewall:
    max_message_length: 10000
    max_messages_per_second: 5.0
    max_messages_per_minute: 100
    duplicate_threshold: 3
    duplicate_window_seconds: 30
  frontend:
    max_upload_size_mb: 500
    max_chat_images: 20
    avatar_min_width: 100
    avatar_max_width: 1200
    temperature_max: 5
    speed_max: 3
