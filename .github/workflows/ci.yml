name: CX-O CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # D2 修复：项目要求 Python 3.11+（README），且本地环境为 py311
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # D2 修复：依赖与测试真实位于根 requirements.txt 与 CX-O-SERVER/
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run backend tests
        working-directory: ./CX-O-SERVER
        run: python -B -m pytest -q -p no:cacheprovider

      # 登记（第十二轮 G4 评估）：CX-O-VoiceWorkStation 实际存在 16 个测试文件
      # （tests/test_*.py，非空占位），但其依赖未固化——pyproject.toml 仅声明
      # jsonschema/music21，且无 requirements.txt（实际运行还需 fastapi/uvicorn/
      # voxcpm 等重量级依赖），CI 环境无法可靠安装，故暂不建 test-vws job。
      # 待 VWS requirements 固化后接入独立 job。

  test-tuner:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./CXO-Tuner
        run: |
          python -m pip install --upgrade pip
          # 依赖以 requirements.txt 为准（pyproject.toml 的 dependencies 为空占位）
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tuner tests
        working-directory: ./CXO-Tuner
        run: python -B -m pytest -q -p no:cacheprovider

  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          # D2 修复：前端目录为 APP-Frontend，包管理器为 npm（package-lock.json）
          cache-dependency-path: APP-Frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./APP-Frontend
        run: npm ci

      - name: Run typecheck
        working-directory: ./APP-Frontend
        run: npm run typecheck

      - name: Run linter
        working-directory: ./APP-Frontend
        run: npm run lint

      - name: Run tests
        working-directory: ./APP-Frontend
        run: npm test -- --reporter=dot

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          # C13（2026-08-30）：锁定 lint 工具版本保证检查结果可复现（仓库无
          # requirements-dev.txt，直接在此锁定；升级时同步验证 ruff/black 规则兼容性）。
          # ruff 0.6.9 / black 24.10.0（2024 末广泛使用的稳定版）/ isort 5.13.2。
          pip install "ruff==0.6.9" "black==24.10.0" "isort==5.13.2"

      - name: Run ruff
        run: |
          # D2 修复：后端源码真实路径为 CX-O-SERVER/server
          ruff check CX-O-SERVER/server

      - name: Run black
        run: |
          black --check CX-O-SERVER/server

      - name: Run isort
        run: |
          isort --check-only CX-O-SERVER/server

