name: CX-O CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # D2 修复：项目要求 Python 3.11+（README），且本地环境为 py311
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # D2 修复：依赖与测试真实位于根 requirements.txt 与 CX-O-SERVER/
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run backend tests
        working-directory: ./CX-O-SERVER
        run: python -B -m pytest -q -p no:cacheprovider

  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          # D2 修复：前端目录为 APP-Frontend，包管理器为 npm（package-lock.json）
          cache-dependency-path: APP-Frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./APP-Frontend
        run: npm ci

      - name: Run typecheck
        working-directory: ./APP-Frontend
        run: npm run typecheck

      - name: Run linter
        working-directory: ./APP-Frontend
        run: npm run lint

      - name: Run tests
        working-directory: ./APP-Frontend
        run: npm test -- --reporter=dot

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          pip install ruff black isort

      - name: Run ruff
        run: |
          # D2 修复：后端源码真实路径为 CX-O-SERVER/server
          ruff check CX-O-SERVER/server

      - name: Run black
        run: |
          black --check CX-O-SERVER/server

      - name: Run isort
        run: |
          isort --check-only CX-O-SERVER/server

  build:
    needs: [test-backend, test-frontend, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          echo "Building Docker images..."
          # Add your Docker build commands here

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            **/dist/*
            **/*.whl
