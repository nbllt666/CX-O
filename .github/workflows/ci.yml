name: CX-O CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: windows-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r CXHMS/requirements.txt
          pip install -r cx-o-gateway/requirements.txt
          pip install pytest pytest-asyncio coverage
          
      - name: Run CXHMS tests
        working-directory: ./CXHMS
        run: pytest backend/tests -v --cov=backend --cov-report=xml
        
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./CXHMS/coverage.xml
          flags: unittests
          
  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: cx-o-frontend/pnpm-lock.yaml
          
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
          
      - name: Install dependencies
        working-directory: ./cx-o-frontend
        run: pnpm install --frozen-lockfile
        
      - name: Run typecheck
        working-directory: ./cx-o-frontend
        run: pnpm run typecheck
        
      - name: Run linter
        working-directory: ./cx-o-frontend
        run: pnpm run lint
        
      - name: Run tests
        working-directory: ./cx-o-frontend
        run: pnpm run test --coverage
        
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install linting tools
        run: |
          pip install ruff black isort
          
      - name: Run ruff
        run: |
          ruff check CXHMS/backend cx-o-gateway
          
      - name: Run black
        run: |
          black --check CXHMS/backend cx-o-gateway
          
      - name: Run isort
        run: |
          isort --check-only CXHMS/backend cx-o-gateway

  build:
    needs: [test-backend, test-frontend, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker images
        run: |
          echo "Building Docker images..."
          # Add your Docker build commands here
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            **/dist/*
            **/*.whl
