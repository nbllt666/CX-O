# CX-O 统一推理服务 Docker Compose 编排
# 包含 LLM (vLLM/TRT-LLM) 和 ASR (FunASR+SenseVoice) 服务
#
# 使用方式:
#   启动所有服务:   docker compose up
#   仅启动 LLM:     docker compose up llm
#   仅启动 ASR:     docker compose up asr-sensevoice
#   指定 LLM 后端:  LLM_BACKEND=vllm docker compose up llm
#                    LLM_BACKEND=trtllm docker compose up llm

services:
  # ============================================================
  # ASR SenseVoice (FunASR) 语音识别服务
  # ============================================================
  asr-sensevoice:
    build:
      context: ./CX-O-SERVER
      dockerfile: ../docker/asr/Dockerfile
    shm_size: '2gb'
    ports:
      - "${ASR_PORT:-8005}:8005"
    environment:
      - PYTHONIOENCODING=utf-8
      - CUDA_VISIBLE_DEVICES=${ASR_GPU:-0}
    volumes:
      - ./CX-O-SERVER/sensevoice:/app/sensevoice:ro
      - ./CX-O-SERVER/api_server.py:/app/api_server.py:ro
      - asr-models:/root/.cache/modelscope
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${ASR_GPU_ID:-0}']
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - cxo-inference

  # ============================================================
  # LLM 推理服务 (vLLM + GGUF 或 TRT-LLM)
  # ============================================================
  llm:
    build:
      context: ./docker/llm
      dockerfile: Dockerfile.${LLM_BACKEND:-vllm}
      args:
        - BUILDKIT_INLINE_CACHE=1
    shm_size: '4gb'
    ports:
      - "${LLM_PORT:-8080}:8080"
    environment:
      # vLLM 模式
      - MODEL_PATH=${LLM_MODEL_PATH:-/workspace/models/model.gguf}
      - HOST=0.0.0.0
      - PORT=8080
      - MAX_MODEL_LEN=${LLM_MAX_MODEL_LEN:-4096}
      - GPU_MEMORY_UTILIZATION=${LLM_GPU_MEM_UTIL:-0.9}
      - DTYPE=${LLM_DTYPE:-auto}
      - MAX_NUM_SEQS=${LLM_MAX_NUM_SEQS:-256}
      - ENABLE_PREFIX_CACHING=${LLM_PREFIX_CACHING:-true}
      # TRT-LLM 模式
      - ENGINE_PATH=${LLM_ENGINE_PATH:-/workspace/engines}
      - MAX_BATCH_SIZE=${LLM_MAX_BATCH_SIZE:-256}
      - MAX_NUM_TOKENS=${LLM_MAX_NUM_TOKENS:-8192}
    volumes:
      - ${LLM_MODELS_DIR:-./models}:/workspace/models:ro
      - llm-engines:/workspace/engines:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${LLM_GPU_ID:-0}']
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - cxo-inference
    profiles:
      - llm

volumes:
  llm-engines:
    driver: local
  asr-models:
    driver: local

networks:
  cxo-inference:
    driver: bridge
