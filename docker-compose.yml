# CX-O 统一推理服务 Docker Compose 聚合入口
#
# 2026-11-01 结构调整（change-id: organize-per-service-docker-deploy）：
#   - 原内联的 asr-sensevoice / llm / cxo-tuner / cxo-evalkit 四段定义已逐字拆入
#     docker/compose/ 下各自独立的 compose 文件，每服务一份、可单独构建与启停。
#   - 拆分原因：单文件混排导致无法按服务独立部署/独立审计，且端口/卷/健康检查
#     变更容易相互影响；拆分后每个服务只有一个真源文件。
#   - 本文件仅作为兼容聚合器，不含任何 service 定义；修改某服务只需改其
#     docker/compose/docker-compose.<service>.yml，根入口自动生效。
#   - 新增的 app 服务（cxo-server / voiceworkstation / neko-adapter）不在本聚合器内，
#     需用各自独立文件启动，例如：
#       docker compose -f docker/compose/docker-compose.server.yml up -d
#
# 使用方式（与拆分前保持一致）：
#   裸启动（仅 asr-sensevoice；llm/tuner/evalkit 受 profile 门控不随裸 up 启动）: docker compose up
#   仅启动 ASR:     docker compose up asr-sensevoice
#   启动 LLM:       docker compose --profile llm up llm
#   启动 Tuner:     docker compose --profile tuner up cxo-tuner
#   启动 EvalKit:   docker compose --profile eval up cxo-evalkit
#   指定 LLM 后端:  LLM_BACKEND=vllm docker compose --profile llm up llm
#                    LLM_BACKEND=trtllm docker compose --profile llm up llm

name: cxo

include:
  - docker/compose/docker-compose.asr.yml
  - docker/compose/docker-compose.llm.yml
  - docker/compose/docker-compose.tuner.yml
  - docker/compose/docker-compose.evalkit.yml
