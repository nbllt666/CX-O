# CX-O 统一推理服务 Docker Compose 编排
# 包含 LLM (vLLM/TRT-LLM) 和 ASR (FunASR+SenseVoice) 服务
#
# 使用方式:
#   启动所有服务:   docker compose up
#   仅启动 LLM:     docker compose up llm
#   仅启动 ASR:     docker compose up asr-sensevoice
#   指定 LLM 后端:  LLM_BACKEND=vllm docker compose up llm
#                    LLM_BACKEND=trtllm docker compose up llm

services:
  # ============================================================
  # ASR SenseVoice (FunASR) 语音识别服务
  # ============================================================
  asr-sensevoice:
    build:
      context: ./CX-O-SERVER
      dockerfile: ../docker/asr/Dockerfile
    shm_size: '2gb'
    ports:
      - "${ASR_PORT:-8005}:8005"
    environment:
      - PYTHONIOENCODING=utf-8
      # 在线聚类相似度阈值（cam++ 余弦；>= 阈值归簇，否则新建会话内临时簇 spk_N）
      - SPK_SIM_THRESHOLD=${SPK_SIM_THRESHOLD:-0.65}
      - CUDA_VISIBLE_DEVICES=  # 2026-08-18 GPU 分配实验结论：GPU0/GPU1 各被 LLM/cosyvoice 占用，无空余 GPU；
                               # ASR 用 GPU0 会挤爆（实测 GPU0 满 19.8GB → 全链路 P50 超 2.9s 退化）。
                               # 回退纯 CPU 推理（T2~280ms），为全链路最稳。
    volumes:
      - ./CX-O-SERVER/sensevoice:/app/sensevoice:ro
      - ./CX-O-SERVER/api_server.py:/app/api_server.py:ro
      # 2026-08-25 流式 ASR 容器改造：引擎包（fsmn-vad 分句 + paraformer 增量 + cam++ 声纹 + 在线聚类）
      - ./CX-O-SERVER/asr_container:/app/asr_container:ro
      # 声纹注册 profiles（服务端权威写入，容器只读消费；/api/v1/voiceprint/profiles/sync 重载）
      - ./CX-O-SERVER/data/voiceprint:/app/data/voiceprint:ro
      - asr-models:/root/.cache/modelscope
    deploy:
      resources:
        reservations:
          devices: []
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - cxo-inference

  # ============================================================
  # LLM 推理服务 (vLLM + GGUF 或 TRT-LLM)
  # ============================================================
  llm:
    build:
      context: ./docker/llm
      dockerfile: Dockerfile.${LLM_BACKEND:-vllm}
      args:
        - BUILDKIT_INLINE_CACHE=1
    shm_size: '4gb'
    ports:
      - "${LLM_PORT:-8080}:8080"
    environment:
      # vLLM 模式
      - MODEL_PATH=${LLM_MODEL_PATH:-/workspace/models/model.gguf}
      - HOST=0.0.0.0
      - PORT=8080
      - MAX_MODEL_LEN=${LLM_MAX_MODEL_LEN:-4096}
      - GPU_MEMORY_UTILIZATION=${LLM_GPU_MEM_UTIL:-0.9}
      - DTYPE=${LLM_DTYPE:-auto}
      - MAX_NUM_SEQS=${LLM_MAX_NUM_SEQS:-256}
      - ENABLE_PREFIX_CACHING=${LLM_PREFIX_CACHING:-true}
      # Dynamic LoRA 支持（默认关闭，LLM_ENABLE_LORA=true 时启用）
      - ENABLE_LORA=${LLM_ENABLE_LORA:-false}
      - BASE_LORA_PATH=${LLM_BASE_LORA_PATH:-/workspace/models/base_lora}
      - MAX_LORAS=${LLM_MAX_LORAS:-8}
      - LORA_MODULES=${LLM_LORA_MODULES:-}
      # TRT-LLM 模式
      - ENGINE_PATH=${LLM_ENGINE_PATH:-/workspace/engines}
      - MAX_BATCH_SIZE=${LLM_MAX_BATCH_SIZE:-256}
      - MAX_NUM_TOKENS=${LLM_MAX_NUM_TOKENS:-8192}
    volumes:
      - ${LLM_MODELS_DIR:-./models}:/workspace/models:ro
      - llm-engines:/workspace/engines:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${LLM_GPU_ID:-0}']
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - cxo-inference
    profiles:
      - llm

  # ============================================================
  # CXO-Tuner 进化服务（QLoRA 微调 / 在线 DPO 进化）
  # ============================================================
  # 可选 profile：仅 `docker compose --profile tuner up` 时才启动，
  # 不启用时完全不影响主系统（asr-sensevoice / llm）。
  # 镜像约定：cxo/tuner:latest 由 CXO-Tuner 目录下的 Dockerfile 构建（如尚未提供则直接拉取）。
  cxo-tuner:
    image: cxo/tuner:latest
    profiles:
      - tuner
    ports:
      - "${CXO_TUNER_PORT:-8300}:8300"
    environment:
      # tuner/config.py load_config() 从 CXO_TUNER_CONFIG(JSON) 读取全部配置；
      # 此处由 compose 变量拼装 JSON，保证镜像内可直接解析，与 config.py 读取方式对齐。
      # CUDA_VISIBLE_DEVICES 留空（默认）时 tuner 回退纯 CPU 推理；需 GPU 时注入如 "0"。
      - CXO_TUNER_CONFIG={"judge_model":"${CXO_TUNER_JUDGE_MODEL:-}","base_model":"${CXO_TUNER_BASE_MODEL:-}","vllm_url":"${CXO_TUNER_VLLM_URL:-}","dataset_dir":"/app/data/dataset","lora_dir":"/app/models/lora","character_cards_dir":"/app/data/anchors","trainer":{"CUDA_VISIBLE_DEVICES":"${CXO_TUNER_CUDA_DEVICES:-}"}}
      # 便于人为可读的独立变量（与台积约定对齐），实际取值以上述 CXO_TUNER_CONFIG 为准
      - CXO_TUNER_JUDGE_MODEL=${CXO_TUNER_JUDGE_MODEL:-}
      - CXO_TUNER_BASE_MODEL=${CXO_TUNER_BASE_MODEL:-}
      - CUDA_VISIBLE_DEVICES=${CXO_TUNER_CUDA_DEVICES:-}
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./data/tuner_dataset:/app/data/dataset
      - ./models/lora:/app/models/lora
      - ./config/character_cards:/app/data/anchors
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - cxo-inference

volumes:
  llm-engines:
    driver: local
  asr-models:
    driver: local

networks:
  cxo-inference:
    driver: bridge
