services:
  weaviate:
    image: semitechnologies/weaviate:1.26.6
    container_name: weaviate
    restart: unless-stopped
    ports:
      - "8090:8080"
      - "50061:50051"
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMO_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=none
      - ENABLE_MODULES=text2vec-transformers,text2vec-openai,text2vec-cohere,text2vec-huggingface
      - TRANSFORMERS_INFERENCE_API=http://t2v-transformers:8080
      - CLUSTER_HOSTNAME=weaviate-node-1
      - GOMEMLIMIT=8192MiB
      - PROMETHEUS_MONITORING_ENABLED=false
      - TRACK_VECTOR_DIMENSIONS=true
    volumes:
      - weaviate_data:/var/lib/weaviate
    depends_on:
      t2v-transformers:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          memory: 2G
        limits:
          memory: 8G
    networks:
      - weaviate-network

  t2v-transformers:
    image: semitechnologies/transformers-inference:sentence-transformers-all-MiniLM-L6-v2
    container_name: weaviate-t2v-transformers
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - ENABLE_CUDA=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - TRANSFORMERS_CACHE=/cache
      - HF_HOME=/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
          memory: 4G
        limits:
          memory: 8G
    volumes:
      - transformers_cache:/cache
      - huggingface_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/.well-known/ready')"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    networks:
      - weaviate-network

volumes:
  weaviate_data:
    driver: local
  transformers_cache:
    driver: local
  huggingface_cache:
    driver: local

networks:
  weaviate-network:
    driver: bridge
