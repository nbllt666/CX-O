services:
  weaviate:
    image: semitechnologies/weaviate:1.26.6
    container_name: weaviate
    restart: unless-stopped
    ports:
      - "8090:8080"
      - "50061:50051"
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMO_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=none
      - ENABLE_MODULES=text2vec-openai,text2vec-cohere,text2vec-huggingface
      - CLUSTER_HOSTNAME=weaviate-node-1
      - GOMEMLIMIT=8192MiB
      - PROMETHEUS_MONITORING_ENABLED=false
      - TRACK_VECTOR_DIMENSIONS=true
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          memory: 2G
        limits:
          memory: 8G
    networks:
      - weaviate-network

volumes:
  weaviate_data:
    driver: local

networks:
  weaviate-network:
    driver: bridge
