services:
  inference-service:
    build:
      context: .
      dockerfile: inference_service/Dockerfile
    container_name: f5-inference-service
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8000:8000"
    volumes:
      - ./f5_trt_llm_engine_rebuilt:/engines:ro
      - ./F5-TTS/F5TTS_Base:/models/F5TTS_Base:ro
      - ./vocos_vocoder.plan:/models/vocoder/vocoder.plan:ro
      - ./inference_service:/app/inference_service:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    shm_size: "2gb"
    restart: unless-stopped

  gateway:
    image: soar97/triton-f5-tts:24.12
    container_name: f5-gateway
    ports:
      - "18081:8080"
    volumes:
      - ./gateway:/app/gateway:ro
    environment:
      - INFERENCE_SERVICE_URL=http://inference-service:8000
    depends_on:
      inference-service:
        condition: service_healthy
    restart: unless-stopped
    command: >
      bash -c "
      pip install -i https://pypi.tuna.tsinghua.edu.cn/simple fastapi uvicorn python-multipart httpx websockets pydantic &&
      cd /app/gateway && PYTHONPATH=/app/gateway python3 main.py
      "
