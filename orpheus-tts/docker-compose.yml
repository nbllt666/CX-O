# ============================================================
# Orpheus TTS vLLM 独立服务 Docker Compose 编排
# 为 CX-O 全双工实时语音模式提供独立的 TTS 推理服务
#
# 架构:
#   orpheus-vllm  — vLLM OpenAI 兼容服务（加载 Orpheus 3B 模型，生成 SNAC tokens）
#   orpheus-tts   — FastAPI bridge（SNAC 解码 → 24kHz WAV，暴露 OpenAI 兼容 TTS API）
#
# 使用方式:
#   启动:   docker compose up -d orpheus-tts
#   健康检查: curl http://localhost:5060/health
#   停止:   docker compose down
#
# GPU 分配:
#   默认使用 GPU 1（CUDA_VISIBLE_DEVICES=1），避免与 LLM（GPU 0）争抢显存
#   Orpheus 3B 约占 8-10GB，双 RTX 3080 20GB 单卡运行充裕
# ============================================================

services:
  # ============================================================
  # vLLM 后端 — 加载 Orpheus 多语言模型，提供 OpenAI 兼容 /v1/completions
  # ============================================================
  orpheus-vllm:
    image: vllm/vllm-openai:latest
    shm_size: '4gb'
    ports:
      # vLLM 内部端口（仅用于调试，生产环境可移除此映射）
      - "${ORPHEUS_VLLM_PORT:-8000}:8000"
    environment:
      - PYTHONIOENCODING=utf-8
      # FlashInfer 注意力后端（高性能，适合 Llama-3B 架构）
      - VLLM_ATTENTION_BACKEND=FLASHINFER
      # 指定单卡运行，避免与 LLM（GPU 0）争抢
      - CUDA_VISIBLE_DEVICES=${ORPHEUS_CUDA_VISIBLE:-0}
      # HuggingFace 模型缓存目录
      - HF_HOME=/workspace/hf_cache
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    volumes:
      - orpheus-hf-cache:/workspace/hf_cache
      # 本地预下载模型挂载
      - ../models/orpheus-multilingual:/workspace/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # 物理 GPU ID（默认 1，即第二张卡）
              device_ids: ['${ORPHEUS_GPU_ID:-0}']
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped
    command: >
      vllm serve /workspace/models
      --host 0.0.0.0
      --port 8000
      --max-model-len ${ORPHEUS_MAX_MODEL_LEN:-4096}
      --gpu-memory-utilization ${ORPHEUS_GPU_MEM_UTIL:-0.9}
      --dtype ${ORPHEUS_DTYPE:-auto}
      --max-num-seqs ${ORPHEUS_MAX_NUM_SEQS:-8}
      --trust-remote-code
      --enable-prefix-caching
    networks:
      - orpheus-net

  # ============================================================
  # FastAPI Bridge — SNAC 解码 + OpenAI 兼容 TTS API（端口 5060）
  # ============================================================
  orpheus-tts:
    build:
      context: .
      dockerfile: Dockerfile
    shm_size: '2gb'
    ports:
      # 对外暴露的 TTS HTTP 端口
      - "${ORPHEUS_TTS_PORT:-5060}:5060"
    environment:
      - PYTHONIOENCODING=utf-8
      # vLLM 后端地址（Docker 网络内通过服务名访问）
      - VLLM_BASE_URL=http://orpheus-vllm:8000
      - VLLM_MODEL=/workspace/models
      # SNAC 解码器设备（cuda 或 cpu；cpu 可避免与 vLLM 争抢 GPU）
      - SNAC_DEVICE=${ORPHEUS_SNAC_DEVICE:-cuda}
      # SNAC 解码器模型路径
      - SNAC_MODEL_PATH=/workspace/snac
      # Orpheus 生成参数
      - ORPHEUS_TEMPERATURE=${ORPHEUS_TEMPERATURE:-0.6}
      - ORPHEUS_TOP_P=${ORPHEUS_TOP_P:-0.95}
      - ORPHEUS_MAX_TOKENS=${ORPHEUS_MAX_TOKENS:-8192}
      # 指定单卡（SNAC 解码器在 cuda 模式时使用）
      - CUDA_VISIBLE_DEVICES=${ORPHEUS_CUDA_VISIBLE:-0}
    volumes:
      - orpheus-snac-cache:/root/.cache/huggingface
      # SNAC 解码器模型
      - ../models/snac_24khz:/workspace/snac:ro
      # 本地 Orpheus 模型（tokenizer 用）
      - ../models/orpheus-multilingual:/workspace/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${ORPHEUS_GPU_ID:-0}']
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5060/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    depends_on:
      orpheus-vllm:
        condition: service_healthy
    networks:
      - orpheus-net

volumes:
  orpheus-hf-cache:
    driver: local
  orpheus-snac-cache:
    driver: local

networks:
  orpheus-net:
    driver: bridge
