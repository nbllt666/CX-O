appId: com.cx-o.frontend
productName: CX-O
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
extraMetadata:
  main: dist-electron/main.js
win:
  target:
    - nsis
  icon: public/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  target:
    - dmg
  icon: public/icon.png
linux:
  target:
    - AppImage
  icon: public/icon.png
