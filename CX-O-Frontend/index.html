    <script>(function(){try{var k='cx-o-theme';var f='dark';var t=f;try{var r=localStorage.getItem(k);if(r){var p=JSON.parse(r);var v=p&&p.state&&p.state.theme?p.state.theme:p;if(v==='dark'||v==='light'){t=v;}}}catch(e){}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
