[project]
name = "cx-o-voiceworkstation"
version = "0.1.0"
description = "CX-O VoiceWorkStation 语音工作站后端"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.0",
    "music21>=9.1",
    # 音域分析（librosa pyin F0 提取）；enhance-cover-pitch-analysis-duet Task 1
    "librosa>=0.11",
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
