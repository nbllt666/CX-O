version: '3.8'

services:
  vllm:
    image: vllm/vllm:latest
    container_name: cx-o-vllm
    ports:
      - "8000:8000"
    volumes:
      - C:/CX-O/CX-O/models:/app/models
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
    command: |
      --model /app/models/glm-4v-9b-Q8_0.gguf
      --tokenizer THUDM/glm-4v-9b
      --port 8000
      --host 0.0.0.0
      --max-model-len 8192
      --max-num-seqs 8
      --gpu-memory-utilization 0.9
      --enforce-eager
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
